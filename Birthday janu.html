<style>
/* ===========================================================
   Animated Birthday Cake  –  HTML + CSS (cake pure CSS)
   Cake onek chhoto chhoto ".c" slice diye banano. Protita slice
   nijer delay ({--w}) e porey, tai layer gulo ektu bend hoye pore
   (video-r moto). Pure CSS: .slab / .st / .ice / ::before / ::after
   =========================================================== */

:root{
  --bg:#f08dab;
  --cream:#fdf3e1;
  --sponge1:#b08373;
  --sponge2:#a87a6b;
  --choco:#915c52;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none}

/* ---------------- Screen 1 ---------------- */
.intro{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:34px;padding:24px;text-align:center;
  transition:opacity .6s ease,visibility .6s}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.intro h1{font:italic 600 clamp(30px,9vw,54px)/1.2 'Poppins',sans-serif;color:#fff8ea;
  text-shadow:0 3px 0 rgba(145,92,82,.25);animation:float 3s ease-in-out infinite}
.intro h1 small{display:block;font-size:.5em;opacity:.9;margin-bottom:6px}
.open-btn{font:italic 600 18px 'Poppins',sans-serif;color:#a0566a;background:var(--cream);border:0;
  border-radius:40px;padding:14px 38px;cursor:pointer;box-shadow:0 6px 0 #c9748c;
  transition:transform .15s,box-shadow .15s}
.open-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #c9748c}
@keyframes float{50%{transform:translateY(-8px)}}

/* ---------------- Screen 2 ---------------- */
.scene{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.world{position:relative;flex:none;width:400px;height:370px;transform:scale(var(--s,1))}

.plate{position:absolute;left:61px;top:242px;width:277px;height:4px;border-radius:2px;background:#fbf1e2;
  transform:scaleX(0)}

.cake-all{position:absolute;inset:0;transform-origin:200px 241px}

/* ---- the slices ---- */
.c{position:absolute;left:calc(82.5px + var(--i) * 2.5px);top:0;width:2.5px;height:100%}
.c i{position:absolute;left:0;width:2.9px;display:block}

.slab{opacity:0}
.s1{top:calc(215px + var(--r) * 1px);height:calc(26px - var(--r) * 2px);background:var(--sponge1)}
.s2{top:calc(179px + var(--r) * 1px);height:calc(27px - var(--r) * 2px);background:var(--sponge2)}
.s3{top:calc(141px + var(--r) * 1px);height:calc(29px - var(--r) * 2px);background:var(--sponge2)}

.st{opacity:0;background:var(--choco)}
.st1{top:calc(204px + var(--rs) * 1px);height:calc(12px - var(--rs) * 2px)}
.st2{top:calc(167px + var(--rs) * 1px);height:calc(12px - var(--rs) * 2px)}

.ice{top:calc(var(--t) * 1px);height:0;background:var(--cream);border-radius:0 0 1.4px 1.4px}

/* chocolate pour (teardrop) */
.pour{position:absolute;left:190px;width:20px;height:56px;background:var(--choco);opacity:0;
  clip-path:path('M10 0 C11 18 20 34 20 48 C20 56 0 56 0 48 C0 34 9 18 10 0Z')}
.p1{top:150px}
.p2{top:113px}

/* cream blob */
.blob{position:absolute;left:115px;top:101px;width:168px;height:40px;background:var(--cream);opacity:0;
  transform-origin:50% 100%;transform:scaleY(0);
  clip-path:path('M0 39 Q-3 29 15 25 Q25 19 38 21 Q48 2 69 0 Q84 -2 88 12 Q100 8 112 18 Q124 14 138 24 Q168 24 168 39Z')}

/* ---- candle ---- */
.candle{position:absolute;left:168px;top:48px;width:64px;height:94px;cursor:pointer;opacity:0}
.wax{position:absolute;left:28px;top:47px;width:9px;height:47px;background:#fcf8ee}
.wax::before,.wax::after{content:"";position:absolute;left:0;width:100%;background:#ecd3d2}
.wax::before{top:14.5px;height:3px}
.wax::after{top:22.5px;height:2px}
.flame{position:absolute;left:25.5px;top:11px;width:13px;height:30px;opacity:0;transform-origin:50% 100%;
  background:linear-gradient(to bottom,#ffb02e,#ffd84a 45%,#fff3a8);
  clip-path:path('M6.5 0 C9.5 9 13 15 13 22 C13 27 10 30 6.5 30 C3 30 0 27 0 22 C0 15 3.5 9 6.5 0Z')}
.glow{position:absolute;left:-2px;top:-8px;width:68px;height:68px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(255,240,176,.75),rgba(255,216,144,.35) 45%,rgba(255,216,144,0) 70%)}
.puff{position:absolute;left:29px;top:21px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:0}
.puff.b{left:28px;width:5px;height:5px}
.puff.c{left:30px;width:4px;height:4px}

/* ---- text ---- */
.label{position:absolute;left:0;top:297px;width:400px;text-align:center;color:#9a5063;opacity:0}
.hb{font:italic 400 32px/36px 'Lato','Open Sans',sans-serif;opacity:.85}
.name{margin-top:3.5px;font:italic 400 15px/18px 'Lato','Open Sans',sans-serif;opacity:.55}

.hint,.again{position:absolute;left:0;right:0;bottom:9%;text-align:center;opacity:0;pointer-events:none;
  font:italic 600 15px 'Poppins',sans-serif}
.hint{color:#fff8ea}
.again button{font:inherit;color:#a0566a;background:var(--cream);border:0;border-radius:30px;
  padding:10px 26px;cursor:pointer;box-shadow:0 4px 0 #c9748c}

/* =================== Timeline =================== */
.play .plate{animation:plate .6s .05s cubic-bezier(.3,.9,.3,1) forwards}
.play .label{animation:fadein .8s .3s forwards}

/* slices drop one after the other, edges a little late => bend */
.play .s1{animation:in .5s calc(.5s  + var(--w) * 1.6ms) cubic-bezier(.5,0,.8,.5) forwards}
.play .s2{animation:in .5s calc(1.65s + var(--w) * 1.6ms) cubic-bezier(.5,0,.8,.5) forwards}
.play .s3{animation:in .5s calc(2.8s  + var(--w) * 1.6ms) cubic-bezier(.5,0,.8,.5) forwards}

.play .p1{animation:pour .5s 1.05s ease-in forwards}
.play .p2{animation:pour .5s 2.2s  ease-in forwards}
.play .st1{animation:fadein .2s calc(1.4s  + var(--w) * 6ms) forwards}
.play .st2{animation:fadein .2s calc(2.55s + var(--w) * 6ms) forwards}

.play .blob{animation:blob .5s 3.4s cubic-bezier(.3,1.4,.5,1) forwards, blobout .5s 4.1s forwards}
.play .ice{animation:drip calc(.35s + var(--h) * 9ms) calc(3.7s + var(--i) * 3ms) cubic-bezier(.3,.8,.4,1) forwards}

.play .candle{animation:cdrop .7s 4.9s cubic-bezier(.35,1.25,.5,1) forwards}
.play .flame{animation:ignite .5s 5.7s forwards, flicker .4s 6.2s infinite alternate ease-in-out}
.play .glow{animation:fadein .7s 5.8s forwards, glowpulse 1.6s 6.5s infinite alternate ease-in-out}
.play .hint{animation:fadein .6s 6.4s forwards, blink 1.5s 7s infinite}

/* tap the candle */
.out .hint{animation:none;opacity:0}
.out .candle{animation:sink .9s ease-in forwards;pointer-events:none}
.out .flame,.out .glow{animation:none;opacity:0}
.out .puff{animation:puff 1.1s ease-out forwards}
.out .puff.b{animation-delay:.12s}
.out .puff.c{animation-delay:.24s}
.out .cake-all{animation:vanish .8s 1.3s ease-in forwards}
.out .again{animation:fadein .6s 2.5s forwards}
.out .again button{pointer-events:auto}

/* =================== Keyframes =================== */
@keyframes plate{to{transform:scaleX(1)}}
@keyframes fadein{to{opacity:1}}
@keyframes blink{50%{opacity:.35}}
@keyframes in{                 /* video-r  "animation: in ..."  */
  0%{opacity:1;transform:translateY(-300px)}
  88%{opacity:1;transform:translateY(0)}
  94%{opacity:1;transform:translateY(2px)}
  100%{opacity:1;transform:translateY(0)}}
@keyframes pour{
  0%{opacity:1;transform:translateY(-150px)}
  85%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(0)}}
@keyframes blob{to{opacity:1;transform:scaleY(1)}}
@keyframes blobout{to{opacity:0}}
@keyframes drip{from{height:0}to{height:calc(var(--h) * 1px)}}
@keyframes cdrop{
  0%{opacity:0;transform:translateY(-200px)}
  15%{opacity:1}
  100%{opacity:1;transform:translateY(0)}}
@keyframes ignite{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes flicker{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.08) rotate(3deg)}}
@keyframes glowpulse{from{opacity:1}to{opacity:.65}}
@keyframes sink{from{opacity:1;transform:translateY(0)}60%{opacity:1}to{opacity:0;transform:translateY(46px)}}
@keyframes puff{from{opacity:.8;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-45px) scale(4)}}
@keyframes vanish{to{opacity:0;transform:scaleY(.05)}}

/* tap sirf candle e jabe, cake-er slice e na */
.cake-all > *:not(.candle){pointer-events:none}
.c i{pointer-events:none}

/* =========================================================
   4 ta letter + gaan

.letters{position:absolute;left:35px;top:104px;width:330px;display:flex;flex-wrap:wrap;justify-content:center;gap:34px 14px;pointer-events:none}
.env{position:relative;flex:none;width:66px;height:46px;border:0;border-radius:4px;cursor:pointer;
  background:
    linear-gradient(to top right,transparent 49%,rgba(145,92,82,.22) 50%,transparent 52%) left bottom/50% 100% no-repeat,

  box-shadow:0 3px 0 rgba(145,92,82,.38);
  opacity:0;transform:translateY(24px) rotate(var(--rot));transition:transform .2s ease}
.env::before{content:"";position:absolute;inset:0;border-radius:4px 4px 0 0;background:#f4e5c9;
  clip-path:polygon(0 0,100% 0,50% 64%)}
.seal{position:absolute;left:50%;top:21px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;

.env:hover,.env:focus-visible{transform:translateY(-4px) rotate(var(--rot));outline:none}

.out .letters{pointer-events:auto}
.out .env{animation:envin .55s cubic-bezier(.3,1.4,.5,1) forwards;animation-delay:calc(2.3s + var(--n) * .18s)}
@keyframes envin{to{opacity:1;transform:translateY(0) rotate(var(--rot))}}

.hint2{position:absolute;left:0;right:0;bottom:16%;text-align:center;opacity:0;pointer-events:none;

/* letter kholar card */
.paper-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;

<script>
// =====================================================================
//  Birthday tree  (canvas)
//  heart tap -> dot mati te pore -> gach barhe -> phul ashe -> letter type hoy
// =====================================================================
window.BirthdayTree = (function () {
  var screen = document.getElementById('treeScreen');
  var canvas = document.getElementById('treeCanvas');
  var ctx = canvas.getContext('2d');
  var panel = document.getElementById('tletter');
  var dearEl = document.getElementById('tdear');
  var bodyEl = document.getElementById('tbody');
  var againBtn = document.getElementById('treeAgain');
  var clickBtn = document.getElementById('treeClick');
  var btnRow = document.getElementById('tbtns');

  var LW = 400, LH = 400, GROUND = 384, TX = 200, T0 = 1.5;
  var PINK = '#efb5c6';
  var BLOOM = ['#f7bccd', '#f19db6', '#ffd3df', '#e98aa8', '#f4aec2'];

  var cfg = { dear: 'Dear Fata,', lines: [] };
  var dpr = 1, scale = 1, ox = 0, oy = 0, cw = 0, ch = 0;
  var state = 'hidden', tStart = 0, raf = null, last = 0, typeId = 0;
  var onClickMe = null;
  var branches = [], blooms = [], petals = [], landed = [], rnd, spawnAcc = 0, onAgain = null;

  function mulberry(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function easeBack(t) { var c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

  /* ---------- tree shape ---------- */
  function pointAt(b, t) {
    var u = 1 - t;
    return { x: u * u * b.x + 2 * u * t * b.cx + t * t * b.ex, y: u * u * b.y + 2 * u * t * b.cy + t * t * b.ey };
  }
  function tangentAt(b, t) {
    var u = 1 - t;
    var dx = 2 * u * (b.cx - b.x) + 2 * t * (b.ex - b.cx);
    var dy = 2 * u * (b.cy - b.y) + 2 * t * (b.ey - b.cy);
    var l = Math.sqrt(dx * dx + dy * dy) || 1;
    return { x: dx / l, y: dy / l };
  }

  function build() {
    rnd = mulberry(11);
    branches = []; blooms = []; petals = []; landed = [];

    function add(x, y, ang, len, w, depth, start, dur) {
      var curve = (rnd() - 0.5) * 0.5;
      var ex = x + Math.sin(ang) * len, ey = y - Math.cos(ang) * len;
      var cx = (x + ex) / 2 + Math.cos(ang) * curve * len;
      var cy = (y + ey) / 2 + Math.sin(ang) * curve * len;
      var b = { x: x, y: y, cx: cx, cy: cy, ex: ex, ey: ey, w: w, depth: depth, start: start, dur: dur };
      branches.push(b);
      if (depth < 4) {
        var n = depth === 0 ? 5 : 2;
        for (var i = 0; i < n; i++) {
          var at = depth === 0 ? 0.3 + i * 0.15 : 0.42 + rnd() * 0.45;
          var side = (i % 2) ? 1 : -1;
          var a2 = clamp((ang + side * (0.5 + rnd() * 0.5)) * 0.88, -1.25, 1.25);
          var p = pointAt(b, at);
          var l2 = len * (depth === 0 ? 0.58 - i * 0.05 : 0.64);
          var w2 = Math.max(1.2, w * (1 - at) * 0.8);
          add(p.x, p.y, a2, l2, w2, depth + 1, start + at * dur, 0.35 + l2 * 0.0055);
        }
      }
    }
    add(TX, GROUND, 0.02, 190, 21, 0, T0, 1.7);

    // blossoms sit on the thin branches
    branches.forEach(function (b) {
      if (b.depth < 2) return;
      for (var k = 0; k < 3; k++) {
        var p = pointAt(b, 0.35 + rnd() * 0.65);
        blooms.push({
          x: p.x + (rnd() - 0.5) * 12, y: p.y + (rnd() - 0.5) * 12,
          s: 5 + rnd() * 5, c: BLOOM[(rnd() * BLOOM.length) | 0], r: (rnd() - 0.5) * 0.9,
          d: 4.4 + rnd() * 3.8
        });
      }
    });
  }

  /* ---------- drawing ---------- */
  function heart(x, y, s, rot, color) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot || 0);
    var k = s / 17;
    ctx.beginPath();
    for (var i = 0; i <= 28; i++) {
      var a = i / 28 * Math.PI * 2;
      var hx = 16 * Math.pow(Math.sin(a), 3);
      var hy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a));
      if (i === 0) ctx.moveTo(hx * k, hy * k); else ctx.lineTo(hx * k, hy * k);
    }
    ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.restore();
  }

  function drawBranch(b, p) {
    var N = Math.max(4, Math.ceil(18 * p)), L = [], R = [];
    for (var i = 0; i <= N; i++) {
      var tt = p * i / N, s = tt / p;
      var pt = pointAt(b, tt), tg = tangentAt(b, tt);
      var wd = b.w * (1 - 0.85 * tt) * (1 - Math.pow(s, 4)) + 0.4;
      if (b.depth === 0 && tt < 0.12) wd *= 1 + (0.12 - tt) * 5;      // trunk flare
      wd /= 2;
      L.push([pt.x - tg.y * wd, pt.y + tg.x * wd]);
      R.push([pt.x + tg.y * wd, pt.y - tg.x * wd]);
    }
    ctx.beginPath();
    ctx.moveTo(L[0][0], L[0][1]);
    for (i = 1; i < L.length; i++) ctx.lineTo(L[i][0], L[i][1]);
    for (i = R.length - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
    ctx.closePath();
    ctx.fillStyle = PINK; ctx.fill();
  }

  function drawSeedHeart(now) {
    var beat = 1 + Math.sin(now * 5) * 0.07;
    heart(158, 164, 22 * beat, 0, '#ee9db5');
    ctx.fillStyle = '#e48aa6';
    ctx.font = '400 11px "Hind Siliguri", sans-serif';
    ctx.fillText('ট্যাপ করো', 184, 160);
    ctx.fillText('নোভা ♥', 184, 172);
    ctx.strokeStyle = '#efb5c6'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(180, 178); ctx.lineTo(262, 178); ctx.stroke();
  }

  function frame(ts) {
    raf = requestAnimationFrame(frame);
    var now = ts / 1000;
    var dt = Math.min(0.05, now - last); last = now;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);

    if (state === 'idle') { drawSeedHeart(now); return; }
    var t = now - tStart;

    // seed: heart -> dot -> falls to the ground
    if (t < T0) {
      var a = clamp(t / 0.5, 0, 1);
      if (a < 1) {
        heart(158, 164, 22 * (1 - a) + 3 * a, 0, '#ee9db5');
        ctx.globalAlpha = 1 - a; ctx.fillStyle = '#e48aa6';
        ctx.font = '400 11px "Hind Siliguri", sans-serif';
        ctx.fillText('ট্যাপ করো', 184, 160); ctx.fillText('নোভা ♥', 184, 172);
        ctx.globalAlpha = 1;
      } else {
        var f = clamp((t - 0.5) / 0.9, 0, 1);
        var x = 158 + (TX - 158) * f;
        var y = 164 + (GROUND - 164) * f * f - Math.sin(f * Math.PI) * 34;
        ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fillStyle = '#ee9db5'; ctx.fill();
      }
      return;
    }

    // branches
    for (var i = 0; i < branches.length; i++) {
      var b = branches[i];
      var p = easeOut(clamp((t - b.start) / b.dur, 0, 1));
      if (p > 0.01) drawBranch(b, p);
    }

    // landed petals
    for (i = 0; i < landed.length; i++) heart(landed[i].x, landed[i].y, landed[i].s * 0.8, landed[i].r, landed[i].c);

    // blossoms
    var ready = [];
    for (i = 0; i < blooms.length; i++) {
      var m = blooms[i], q = (t - m.d) / 0.65;
      if (q <= 0) continue;
      q = clamp(q, 0, 1);
      heart(m.x, m.y, m.s * easeBack(q), m.r, m.c);
      if (q >= 1) ready.push(m);
    }

    // falling petals
    if (t > 8 && ready.length) {
      spawnAcc += dt;
      while (spawnAcc > 0.14 && petals.length < 70) {
        spawnAcc -= 0.14;
        var src = ready[(Math.random() * ready.length) | 0];
        petals.push({ x: src.x, y: src.y, x0: src.x, vy: 16 + Math.random() * 26, ph: Math.random() * 6,
                      amp: 8 + Math.random() * 16, s: 3.5 + Math.random() * 3, c: src.c, r: Math.random() * 3, age: 0, fade: 0 });
      }
      if (spawnAcc > 0.5) spawnAcc = 0;
    }
    for (i = petals.length - 1; i >= 0; i--) {
      var pt = petals[i];
      pt.age += dt;
      pt.y += pt.vy * dt;
      pt.x = pt.x0 + Math.sin(pt.age * 1.6 + pt.ph) * pt.amp;
      pt.r += dt * 1.2;
      if (pt.y >= GROUND + 2) {
        if (landed.length < 90) landed.push({ x: pt.x, y: GROUND + 1 + Math.random() * 5, s: pt.s, r: pt.r, c: pt.c });
        petals.splice(i, 1); continue;
      }
      heart(pt.x, pt.y, pt.s, pt.r, pt.c);
    }
  }

  /* ---------- letter typing ---------- */
  function typeLetter() {
    var id = ++typeId;
    panel.classList.add('show');
    dearEl.textContent = '';
    bodyEl.innerHTML = '';
    btnRow.hidden = true;
    var queue = [{ el: dearEl, text: cfg.dear }];
    cfg.lines.forEach(function (ln) {
      var p = document.createElement('p'); bodyEl.appendChild(p);
      queue.push({ el: p, text: ln });
    });
    var seg = (window.Intl && Intl.Segmenter) ? new Intl.Segmenter('bn', {granularity:'grapheme'}) : null;
    queue.forEach(function (q) {
      q.g = seg ? Array.from(seg.segment(q.text), function (x) { return x.segment; }) : Array.from(q.text);
    });
    var qi = 0, ci = 0;
    (function step() {
      if (id !== typeId) return;
      if (qi >= queue.length) { btnRow.hidden = false; panel.scrollTop = panel.scrollHeight; return; }
      var cur = queue[qi];
      ci++;
      cur.el.textContent = cur.g.slice(0, ci).join('');
      panel.scrollTop = panel.scrollHeight;
      if (ci >= cur.g.length) { qi++; ci = 0; setTimeout(step, 450); }
      else setTimeout(step, 34);
    })();
  }

  /* ---------- layout ---------- */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cw = canvas.clientWidth; ch = canvas.clientHeight;
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    scale = Math.min(cw / LW, ch / LH);
    ox = (cw - LW * scale) / 2;
    oy = ch - LH * scale;
  }
  window.addEventListener('resize', function () { if (state !== 'hidden') resize(); });

  function startGrowing() {
    if (state !== 'idle') return;
    state = 'grow';
    tStart = performance.now() / 1000;
    setTimeout(function () { if (state === 'grow') typeLetter(); }, 5200);
  }
  canvas.addEventListener('click', startGrowing);

  againBtn.addEventListener('click', function () { if (onAgain) onAgain(); });
  clickBtn.addEventListener('click', function () {
    var r = clickBtn.getBoundingClientRect();
    btnRow.hidden = true;
    if (onClickMe) onClickMe(r);
  });

  return {
    config: function (c) { cfg = c; },
    onAgain: function (fn) { onAgain = fn; },
    onClickMe: function (fn) { onClickMe = fn; },
    freeze: function () { state = 'frozen'; if (raf) cancelAnimationFrame(raf); raf = null; },
    show: function () {
      screen.classList.add('show');
      panel.classList.remove('show');
      dearEl.textContent = ''; bodyEl.innerHTML = ''; btnRow.hidden = true;
      typeId++;
      build(); resize();
      state = 'idle';
      last = performance.now() / 1000;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(frame);
    },
    hide: function () {
      state = 'hidden'; typeId++;
      screen.classList.remove('show');
      if (raf) cancelAnimationFrame(raf); raf = null;
    }
  };
})();

</script>
<script>
/* ===== Diamond ring (letters) -> name text, repeating ===== */
window.NovaRing=(function(){
  var cv=document.getElementById('ringCanvas'),ctx=cv.getContext('2d');
  var W,H,dpr,S,OX,OY,TAU=Math.PI*2,rnd=Math.random,i;
  var CH="ABCDEFGHJKLMNPRSTUVWXYZ0123456789#%&*+=<>/",LV=10,CELL=32;

  function mkAtlas(c0,c1){
    var a=document.createElement('canvas');a.width=CH.length*CELL;a.height=LV*CELL;
    var g=a.getContext('2d');g.font='700 24px ui-monospace,Menlo,Consolas,monospace';g.textAlign='center';g.textBaseline='middle';
    for(var l=0;l<LV;l++){var f=l/(LV-1);
      g.fillStyle='rgb('+Math.round(c0[0]+(c1[0]-c0[0])*f)+','+Math.round(c0[1]+(c1[1]-c0[1])*f)+','+Math.round(c0[2]+(c1[2]-c0[2])*f)+')';
      for(var c=0;c<CH.length;c++)g.fillText(CH[c],c*CELL+CELL/2,l*CELL+CELL/2+1);}
    return a;
  }
  var ATW=mkAtlas([205,85,125],[255,252,240]);      // white / diamond / text
  var ATG=mkAtlas([150,80,30],[255,232,150]);       // gold band

  var star=document.createElement('canvas');star.width=star.height=128;
  (function(){var g=star.getContext('2d'),r=g.createRadialGradient(64,64,0,64,64,64);
    r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(.12,'rgba(255,255,255,.3)');r.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=r;g.fillRect(0,0,128,128);g.globalCompositeOperation='lighter';
    function ray(a,len,w){g.save();g.translate(64,64);g.rotate(a);var l=g.createLinearGradient(-len,0,len,0);
      l.addColorStop(0,'rgba(255,255,255,0)');l.addColorStop(.5,'rgba(255,255,255,1)');l.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=l;g.fillRect(-len,-w/2,len*2,w);g.restore();}
    ray(0,64,2);ray(Math.PI/2,64,2);ray(Math.PI/4,30,1.2);ray(-Math.PI/4,30,1.2);})();

  /* ---- ring as a cloud of letters ---- */
  var P=[];
  var DIS=15;  /* ring-ta nijei soriye jabe (second) */
  function add(k,x,y,z,nx,ny,nz,ta,size,f,ph){
    var l=Math.hypot(nx,ny,nz)||1;
    P.push({k:k,x:x,y:y,z:z,nx:nx/l,ny:ny/l,nz:nz/l,ta:ta+rnd()*.15,lt:DIS+(1.6-y)*.55+rnd()*.5,
      g:(rnd()*CH.length)|0,sx:(rnd()-.5)*2.4,sy:(rnd()-.5)*2.4,sz:(rnd()-.5)*2.4,s:size,f:f||0,ph:ph||rnd()});
  }
  var RO=.95,RI=.8;
  for(i=0;i<2700;i++){
    var th=rnd()*TAU,w=.16+.18*(1-Math.cos(th))/2,sn=Math.sin(th),cs=Math.cos(th);
    var u=Math.abs(th-Math.PI)/Math.PI,r=rnd(),x,y,z,nx,ny,nz;
    if(r<.4){x=RO*sn;y=RO*cs;z=(rnd()-.5)*w;nx=sn;ny=cs;nz=0;}
    else if(r<.7){x=RI*sn;y=RI*cs;z=(rnd()-.5)*w;nx=-sn;ny=-cs;nz=0;}
    else{var rr=RI+rnd()*(RO-RI),sd=r<.85?1:-1;x=rr*sn;y=rr*cs;z=sd*w/2;nx=0;ny=0;nz=sd;}
    add(0,x,y,z,nx,ny,nz,.5+u*2.5,.062,0,0);
  }
  for(var kk=0;kk<4;kk++){
    var a=Math.PI/4+kk*Math.PI/2,ca=Math.cos(a),sa=Math.sin(a);
    for(i=0;i<85;i++){var s=rnd(),rho=.1+.4*Math.pow(s,1.4),ang=rnd()*TAU;
      add(1,rho*ca+.032*Math.cos(ang),.88+s*.5+.032*Math.sin(ang),rho*sa+.032*Math.sin(ang*1.7),
        ca+Math.cos(ang),Math.sin(ang),sa+Math.sin(ang*1.3),3+s*1.4,.05,0,0);}
  }
  for(i=0;i<140;i++){var ag=rnd()*TAU;add(1,.27*Math.cos(ag),1.02+.03*(rnd()-.5),.27*Math.sin(ag),Math.cos(ag),.2,Math.sin(ag),3.4,.05,0,0);}
  for(i=0;i<200;i++){var ag2=rnd()*TAU,v2=rnd(),rd=.1+.2*v2;
    add(1,rd*Math.cos(ag2),.86+v2*.16,rd*Math.sin(ag2),Math.cos(ag2),.3,Math.sin(ag2),3+v2*.8,.05,0,0);}
  var RG=.5,RT=.28,YG=1.38,HC=.18,HP=.44,YC=YG-HP;
  function poly(phi,ap){var d=((phi%(Math.PI/4))+Math.PI/4)%(Math.PI/4)-Math.PI/8;return ap/Math.cos(d);}
  for(i=0;i<1700;i++){
    var q=rnd(),phi=rnd()*TAU,sec=Math.floor(phi/(Math.PI/4)),pc=(sec+.5)*Math.PI/4,vv=rnd();
    var f2=Math.floor(phi/(Math.PI/8))%2,ap,yy,gx,gy,gz;
    if(q<.2){ap=RT*Math.sqrt(vv);yy=YG+HC;gx=0;gy=1;gz=0;}
    else if(q<.55){ap=RG+(RT-RG)*vv;yy=YG+HC*vv;gx=Math.cos(pc)*HC;gy=RG-RT;gz=Math.sin(pc)*HC;}
    else{ap=RG*(1-vv);yy=YG-HP*vv;gx=Math.cos(pc)*HP;gy=-RG;gz=Math.sin(pc)*HP;}
    var rad=poly(phi,ap);
    add(2,rad*Math.cos(phi),yy,rad*Math.sin(phi),gx,gy,gz,4+(yy-YC)/(HP+HC)*2,.05,sec*2+f2,rnd());
  }
  /* orbiting letter swarm (ring gelew-o thake) */
  var NO=7,OP=[],ORB=[];
  for(i=0;i<NO;i++)ORB.push([1.25+rnd()*.65,.45+rnd()*.55,rnd()*3.14-1.57,rnd()*1.6-.8,(rnd()-.5)*.3]);
  for(i=0;i<900;i++){var oi=i%NO;
    OP.push({o:oi,a:rnd()*TAU,sp:(.25+rnd()*.5)*(oi%2?-1:1),rj:(rnd()-.5)*.22*(rnd()<.2?3:1),
      zj:(rnd()-.5)*.25,g:(rnd()*CH.length)|0,sz:.035+rnd()*rnd()*.09,ph:rnd()*TAU,tw:1+rnd()*3});}
  function orbitPass(t,amp,front){
    if(t<4.2)return;
    var of=Math.min(1,(t-4.2)/2.2)*amp;
    for(var n=0;n<OP.length;n++){
      var p=OP[n],O=ORB[p.o],a=p.a+t*p.sp;
      var ex=(O[0]+p.rj)*Math.cos(a),ey=(O[1]+p.rj*.6)*Math.sin(a);
      var x1=ex*Math.cos(O[2])-ey*Math.sin(O[2]),y1=ex*Math.sin(O[2])+ey*Math.cos(O[2]);
      var z1=y1*Math.sin(O[3])+p.zj;y1=y1*Math.cos(O[3]);
      var yw=t*O[4],xr=x1*Math.cos(yw)+z1*Math.sin(yw),zr=-x1*Math.sin(yw)+z1*Math.cos(yw);
      if((zr>=0)!==front)continue;
      var pp=7/(7-zr),tw=.55+.45*Math.sin(t*p.tw+p.ph),b=(.25+.3*(zr+2)/4)*tw;
      glyph(p.g,Math.min(LV-1,(b*LV*1.4)|0),OX+xr*S*pp,OY-y1*S*pp,S*p.sz*pp*1.6,Math.min(1,b*1.6)*of,ATW);
    }
  }
  var GL=[];
  for(i=0;i<12;i++){var ga=rnd()*TAU,gr=i<7?rnd()*.26:.5*rnd()+.1;
    GL.push({x:gr*Math.cos(ga),y:i<7?YG+HC:YG+HC*rnd(),z:gr*Math.sin(ga),per:1.3+rnd()*1.8,ph:rnd()*TAU});}
  GL.push({x:0,y:-RO,z:0,per:2.1,ph:1},{x:RO,y:0,z:0,per:2.7,ph:2},{x:-RO,y:0,z:0,per:3.1,ph:4});
  var DU=[];for(i=0;i<240;i++)DU.push({x:rnd(),y:rnd(),g:(rnd()*CH.length)|0,ph:rnd()*TAU,sp:.5+rnd()*1.5});

  function norm3(a){var l=Math.hypot(a[0],a[1],a[2]);return[a[0]/l,a[1]/l,a[2]/l];}
  var L1=norm3([-.45,.6,.66]);
  function half(L){return norm3([L[0],L[1],L[2]+1]);}
  var H1=half(L1),H3=half([.15,.9,.4]);

  /* ---- name text: letters fly in, hold, blow away, again & again ---- */
  var TS=DIS+2.6;              /* text shuru */
  var TA=2.1,TH=3.4,TD=1.8,CYC=TA+TH+TD+.7;
  var TP=[],ROWS=[],lastCyc=-1,tCY=0,tY0=0,tHgt=0;
  function buildText(){
    ROWS=[{t:"Rezwanulla Rakib's Wife",k:.8},{t:"Amena Khatun Nova",k:1.12}];
    var off=document.createElement('canvas'),g=off.getContext('2d');
    var fam='italic 600 100px Poppins,"Hind Siliguri",system-ui,sans-serif',wmax=0;g.font=fam;
    ROWS.forEach(function(r){wmax=Math.max(wmax,g.measureText(r.t).width*r.k)});
    var fs=Math.min(Math.min(S*.42,64),100*W*.88/wmax),lhs=fs*1.55;
    var hgt=Math.ceil(lhs*ROWS.length+fs*.8),wd=Math.ceil(W);
    off.width=wd;off.height=hgt;g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff';
    ROWS.forEach(function(r,ri){r.fs=fs*r.k;r.font=fam.replace('100px',r.fs.toFixed(1)+'px');r.y=fs*.4+lhs*(ri+.5);g.font=r.font;g.fillText(r.t,wd/2,r.y)});
    var data=g.getImageData(0,0,wd,hgt).data,st=Math.max(2,fs/11);
    var y0=OY-hgt/2;TP=[];tY0=y0;tHgt=hgt;tCY=OY;TP.step=st;
    for(var y=0;y<hgt;y+=st)for(var x=0;x<wd;x+=st){
      if(data[((y|0)*wd+(x|0))*4+3]>120)TP.push({x:x+(rnd()-.5)*st*.2,y:y0+y+(rnd()-.5)*st*.2,g:(rnd()*CH.length)|0,
        sx:0,sy:0,d1:rnd()*.8,d2:(x/wd)*.5+rnd()*.35,ph:rnd()*TAU});
    }
    lastCyc=-1;
  }
  function rescatter(c){
    var m=c%3;
    for(var n=0;n<TP.length;n++){var p=TP[n];
      if(m===0){p.sx=(rnd()-.5)*S*2.6;p.sy=(rnd()-.5)*S*2.6;}
      else if(m===1){p.sx=(rnd()-.5)*S*.8;p.sy=-S*(1.6+rnd()*2);}
      else{p.sx=(rnd()<.5?-1:1)*S*(1.6+rnd()*1.8);p.sy=(rnd()-.5)*S*.9;}
      p.d1=rnd()*.8;
    }
  }
  function clamp01(v){return Math.min(1,Math.max(0,v))}
  function drawText(t){
    if(t<TS||!TP.length)return;
    var cyc=Math.floor((t-TS)/CYC),tl=(t-TS)-cyc*CYC;
    if(cyc!==lastCyc){lastCyc=cyc;rescatter(cyc);}
    var dEnd=TA+TH,D=TP.step*1.8;
    var ua=clamp01((tl-TA-.3)/.5)*(1-clamp01((tl-dEnd)/(TD*.55)));
    if(ua>.01){
      var gr=ctx.createRadialGradient(W/2,tCY,0,W/2,tCY,W*.62);
      gr.addColorStop(0,'rgba(255,240,215,'+(.34*ua).toFixed(3)+')');gr.addColorStop(1,'rgba(255,240,215,0)');
      ctx.globalAlpha=1;ctx.fillStyle=gr;ctx.fillRect(0,tCY-W,W,W*2);
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';
      ctx.shadowColor='rgba(255,225,160,.95)';ctx.shadowBlur=12;ctx.globalAlpha=.7*ua;
      for(var ri=0;ri<ROWS.length;ri++){ctx.font=ROWS[ri].font;ctx.fillText(ROWS[ri].t,W/2,tY0+ROWS[ri].y);}
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    }
    for(var n=0;n<TP.length;n++){
      var p=TP[n],e=clamp01((tl-p.d1)/TA);e=1-Math.pow(1-e,3);
      var dk=clamp01((tl-dEnd-p.d2)/TD),dke=dk*dk;
      if(e<=.01||dk>=1)continue;
      var k=1-e,wob=Math.sin(t*3+p.ph*20)*6*dk;
      var x=p.x+k*p.sx+dke*(p.sx*.9+S*1.1)+wob,y=p.y+k*p.sy+dke*(p.sy*.6-S*.7)+wob;
      var lv=LV-1-((Math.sin(t*2.4+p.ph*9)>.8&&dk===0)?0:0);
      glyph(p.g,lv,x,y,D*(1-.4*dk),e*(1-dk)*(1-dk*(.3+.3*Math.sin(t*40+p.ph*50))),ATW);
    }
  }
  function textGlints(t){
    if(t<TS||!TP.length)return;
    var cyc=Math.floor((t-TS)/CYC),tl=(t-TS)-cyc*CYC,dEnd=TA+TH;
    var ua=clamp01((tl-TA)/.6)*(1-clamp01((tl-dEnd)/(TD*.5)));
    if(ua<.02)return;
    for(var n=0;n<TP.length;n+=19){
      var p=TP[n],gi=Math.pow(Math.max(0,Math.sin(t*2.1+p.ph*11)),16)*ua;
      if(gi<.03)continue;
      var ss=S*(.2+.5*gi);ctx.globalAlpha=Math.min(1,gi);ctx.drawImage(star,p.x-ss/2,p.y-ss/2,ss,ss);
    }
  }

  function size(){
    W=cv.clientWidth;H=cv.clientHeight;dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    S=Math.min(W*.35,H*.26);OX=W/2;OY=H*.46+.09*S;buildText();
  }
  function glyph(g,l,x,y,d,al,A){ctx.globalAlpha=al;ctx.drawImage(A||ATW,g*CELL,l*CELL,CELL,CELL,x-d/2,y-d/2,d,d);}

  /* drag to rotate */
  var yaw=0,pitch=.16,vy=0,vp=0,drag=false,lx=0,ly=0,lt=0,lastNow=0,running=false,t0=0,raf=0,gone=false;
  cv.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;ly=e.clientY;lt=e.timeStamp;vy=vp=0;try{cv.setPointerCapture(e.pointerId)}catch(err){}});
  cv.addEventListener('pointermove',function(e){if(!drag)return;
    var dx=e.clientX-lx,dy=e.clientY-ly,dtm=Math.max(8,e.timeStamp-lt)/1000;
    yaw+=dx*.009;pitch+=dy*.009;
    vy=vy*.6+.4*Math.max(-8,Math.min(8,dx*.009/dtm));vp=vp*.6+.4*Math.max(-8,Math.min(8,dy*.009/dtm));
    lx=e.clientX;ly=e.clientY;lt=e.timeStamp;});
  function release(e){drag=false;if(e&&e.timeStamp-lt>80)vy=vp=0;}
  cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);

  function frame(now){
    if(!running)return;
    var t=(now-t0)/1000;
    ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(dpr,0,0,dpr,0,0);
    var ringFade=t>DIS+.8?Math.max(0,1-(t-DIS-.8)/1.5):1;
    var dt=lastNow?Math.min(.05,(now-lastNow)/1000):0;lastNow=now;
    if(!drag){vy+=((t>6?.6:0)-vy)*Math.min(1,dt*1.2);vp*=Math.exp(-dt*2.5);yaw+=vy*dt;pitch+=vp*dt;}
    var ang=yaw,cy=Math.cos(yaw),sy=Math.sin(yaw),ct=Math.cos(pitch),st=Math.sin(pitch);
    var a2=t*1.2,L2=norm3([Math.cos(a2),.25,Math.sin(a2)+.3]),H2=half(L2);
    if(t>.4)for(i=0;i<DU.length;i++){var d=DU[i],al=(.1+.26*Math.pow(Math.sin(t*d.sp+d.ph),2))*Math.min(1,(t-.4)/1.5);
      glyph(d.g,5,d.x*W,(.04+.9*d.y)*H+Math.sin(t*.3+d.ph)*4,S*.09,al,ATW);}
    var amp=t>TS?.6:1;
    orbitPass(t,amp,false);
    if(t<DIS+3){
      for(i=0;i<P.length;i++){
        var q=P[i],e=Math.min(1,Math.max(0,(t-q.ta)/.8)),dk=Math.min(1,Math.max(0,(t-q.lt)/1.7)),dke=dk*dk;
        e=1-Math.pow(1-e,3);
        if(e<=.01||dk>=1)continue;
        var k=1-e,wob=Math.sin(t*3+q.ph*20)*.1*dk;
        var X=q.x+k*q.sx+dke*(q.sx*2.2+1.6)+wob,Y=q.y+k*q.sy+dke*(q.sy*1.2+1.2),Z=q.z+k*q.sz+dke*q.sz*2.2+wob;
        var x1r=X*cy+Z*sy,z1r=-X*sy+Z*cy,y1r=Y*ct-z1r*st,z2r=Y*st+z1r*ct;
        var nx1=q.nx*cy+q.nz*sy,nz1=-q.nx*sy+q.nz*cy,ny1=q.ny*ct-nz1*st,nz2=q.ny*st+nz1*ct;
        if(nz2<-.05&&q.k!==1)continue;
        var b,pp=7/(7-z2r);
        if(q.k===2){
          var d2=Math.max(0,nx1*L2[0]+ny1*L2[1]+nz2*L2[2]);
          var fl=.5+.5*Math.sin(q.ph*6.28+q.f*1.7+t*(1.2+.4*(q.f%3))+d2*5+ang*2);
          b=.3+.95*Math.pow(fl,2.4)+(ny1>.9?.2:0);
        }else{
          var dd1=Math.max(0,nx1*L1[0]+ny1*L1[1]+nz2*L1[2]),dd2=Math.max(0,nx1*L2[0]+ny1*L2[1]+nz2*L2[2]);
          var s1=Math.pow(Math.max(0,nx1*H1[0]+ny1*H1[1]+nz2*H1[2]),30);
          var s2=Math.pow(Math.max(0,nx1*H2[0]+ny1*H2[1]+nz2*H2[2]),30);
          var s3=Math.pow(Math.max(0,nx1*H3[0]+ny1*H3[1]+nz2*H3[2]),30);
          b=.12+.5*dd1+.45*dd2+.8*s1+.9*s2+.6*s3;
        }
        b=b*(.75+.25*(z2r+1.2)/2.4)+k*.7+Math.sin(dk*3.14)*.9;
        var lv=Math.min(LV-1,Math.max(0,(b*LV)|0));
        glyph(q.g,lv,OX+x1r*S*pp,OY-y1r*S*pp,q.s*S*pp*1.7*(1-.4*dk),e*(1-dk)*(1-dk*(.3+.3*Math.sin(t*40+q.ph*50))),q.k===2?ATW:ATG);
      }
    }
    orbitPass(t,amp,true);
    drawText(t);
    ctx.globalCompositeOperation='lighter';
    if(t>5&&ringFade>0)for(i=0;i<GL.length;i++){
      var G=GL[i],gi=Math.pow(Math.max(0,Math.sin(TAU*t/G.per+G.ph)),14)*Math.min(1,(t-5)/1.5)*ringFade;
      if(gi<.02)continue;
      var gx1=G.x*cy+G.z*sy,gz1=-G.x*sy+G.z*cy,gy1=G.y*ct-gz1*st,gz2=G.y*st+gz1*ct,gp=7/(7-gz2);
      var ss=S*(.25+.55*gi)*gp;ctx.globalAlpha=Math.min(1,gi);ctx.drawImage(star,OX+gx1*S*gp-ss/2,OY-gy1*S*gp-ss/2,ss,ss);
    }
    textGlints(t);
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    if(!gone&&t>DIS-.6){gone=true;var h=document.querySelector('#ringScreen .rh');if(h)h.classList.add('gone');}
    raf=requestAnimationFrame(frame);
  }
  window.addEventListener('resize',function(){if(running)size()});
  return{
    show:function(){
      var h=document.querySelector('#ringScreen .rh');if(h)h.classList.remove('gone');gone=false;
      size();yaw=0;pitch=.16;vy=vp=0;lastNow=0;lastCyc=-1;
      running=true;t0=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);
    },
    hide:function(){running=false;cancelAnimationFrame(raf);}
  };
})();
</script>

<script>
var NAME='Amena Khatun Nova';
var LETTERS=[
{t:'প্রিয় নোভা',b:['আজ ৯ নভেম্বর। আমার জীবনের সবচেয়ে প্রিয় মানুষটির জন্মদিন। আজকের দিনটি আমার কাছে শুধু একটি জন্মদিন নয়, বরং এমন একজন মানুষের পৃথিবীতে আসার দিন, যিনি আমার জীবনের সঙ্গে জড়িয়ে গেছেন, আমার অনুভূতির একটি বিশেষ অংশ হয়ে উঠেছেন।','তোমাকে জানাই জন্মদিনের অনেক অনেক শুভেচ্ছা ও অফুরন্ত ভালোবাসা। ❤️','আল্লাহর কাছে আমার একটাই প্রার্থনা, তোমার জীবনের প্রতিটি দিন যেন সুন্দর হয়। তোমার মুখের হাসিটা যেন কখনো হারিয়ে না যায়। তোমার সব স্বপ্ন পূরণ হোক, জীবনের প্রতিটি পথে তুমি সফল হও। আল্লাহ তোমাকে সুস্থ রাখুন, ভালো রাখুন এবং তোমার জীবনের প্রতিটি মুহূর্ত রহমত ও বরকতে পরিপূর্ণ করে দিন।']},
{t:'আমাদের গল্প',b:['জানো, আমাদের সম্পর্কের বয়স দুই বছরেরও বেশি। এই দীর্ঘ সময়ে কত হাসি, কত আনন্দ, কত অভিমান, কত রাগ, কত ভুল বোঝাবুঝি, আবার কত সুন্দর স্মৃতি!','কখনো আমরা অনেক ভালো সময় কাটিয়েছি, কখনো ছোটখাটো বিষয় নিয়ে মন খারাপ করেছি। কখনো দূরত্ব তৈরি হয়েছে, আবার কখনো অনেক অভিমান নিয়েও একে অপরের কাছে ফিরে এসেছি।','কিন্তু এত কিছুর পরেও একটা বিষয় কখনো বদলায়নি—সেটা হলো <b>তোমার প্রতি আমার ভালোবাসা।</b>','তুমি আমার জীবনের এমন একজন মানুষ, যাকে আমি হারাতে চাই না। আমি চাই, আমাদের গল্পের শেষটা হোক সারাজীবনের একসঙ্গে থাকার গল্প।']},
{t:'ক্ষমা চাই',b:['আজ তোমার জন্মদিনে তোমাকে কিছু কথা মন থেকে বলতে চাই।','হয়তো অনেক সময় তোমার সঙ্গে এমন আচরণ করেছি, যা তোমার একদমই প্রাপ্য ছিল না। কখনো তোমার অভিমান বুঝতে পারিনি, কখনো তোমার অনুভূতিগুলোকে ঠিকভাবে গুরুত্ব দিতে পারিনি। হয়তো এমন অনেক মুহূর্ত এসেছে, যখন তুমি আমার কাছ থেকে একটু ভালো ব্যবহার, একটু যত্ন কিংবা একটু সময় আশা করেছিলে, কিন্তু আমি দিতে পারিনি।','<b>আজ আমি মন থেকে তোমার কাছে ক্ষমা চাইছি।</b> আমার কোনো কথা, আচরণ কিংবা ভুলের কারণে যদি কখনো তোমার চোখে পানি এসে থাকে, তাহলে আমাকে ক্ষমা করে দিও।','বিশ্বাস করো, তোমাকে কষ্ট দেওয়া কখনোই আমার উদ্দেশ্য ছিল না। আমি আমার ভুলগুলো থেকে শিক্ষা নিয়ে নিজেকে আরও ভালো একজন মানুষ হিসেবে গড়ে তুলতে চাই।']},
{t:'ছোট্ট অনুরোধ',b:['তোমার কাছে আমার ছোট্ট একটা অনুরোধ থাকবে।','জীবনে কখনো কোনো কিছু নিয়ে মন খারাপ হলে, কোনো কারণে কষ্ট পেলে কিংবা আমার কোনো আচরণ খারাপ লাগলে সেটা নিজের মধ্যে জমিয়ে রেখো না।','<b>আমাকে বলবে। আমার সঙ্গে সবকিছু শেয়ার করবে।</b>','তোমার ভালো লাগা, খারাপ লাগা, রাগ, অভিমান, কষ্ট, আনন্দ—সবকিছুতেই আমাকে তোমার পাশে থাকতে দিও। আমি চাই না আমাদের মধ্যে কোনো ভুল বোঝাবুঝি দীর্ঘদিন জমে থাকুক। কোনো সমস্যা হলে আমরা দুজন কথা বলে সমাধান করব।','একটি সুন্দর সম্পর্ক শুধু ভালোবাসা দিয়ে নয়, বিশ্বাস, সম্মান, যত্ন এবং বোঝাপড়া দিয়েও তৈরি হয়।']},
{t:'নতুন শুরু',b:['আজ তোমার জন্মদিনে আমি চাই, আমরা আমাদের সম্পর্কটাকে নতুনভাবে সাজাই।','পুরোনো ভুলগুলো থেকে শিক্ষা নিয়ে নতুনভাবে পথচলা শুরু করি। অতীতের কষ্টগুলোকে পেছনে ফেলে সামনে এগিয়ে যাই।','আমি চাই, আমাদের মধ্যে ভালোবাসা আরও বাড়ুক, বিশ্বাস আরও গভীর হোক, অভিমান হলেও তা যেন ভালোবাসার কাছে হার মেনে যায়।','আমি তোমাকে শুধু ভালো সময়ে পাশে চাই না। জীবনের কঠিন সময়গুলোতেও আমরা একে অপরের হাত ধরে রাখব।']},
{t:'আমাদের স্বপ্ন',b:['ভবিষ্যৎ নিয়ে আমার অনেক স্বপ্ন আছে। আর সেই স্বপ্নগুলোর মধ্যে তোমাকে আমি সব সময় দেখতে চাই।','আমি চাই তোমার সঙ্গে জীবনের ছোট ছোট আনন্দগুলো ভাগ করে নিতে। তোমার হাসির কারণ হতে, তোমার মন খারাপের দিনে তোমাকে সান্ত্বনা দিতে। তোমার সফলতায় তোমার চেয়েও বেশি খুশি হতে চাই। তোমার ব্যর্থতার সময় তোমাকে সাহস দিতে চাই।','একদিন যখন আমরা অতীতের দিকে ফিরে তাকাব, তখন যেন হাসিমুখে বলতে পারি—<i>“হ্যাঁ, আমাদের মধ্যে অনেক ঝগড়া হয়েছে, অনেক অভিমান হয়েছে, অনেক কঠিন সময় এসেছে। কিন্তু আমরা একে অপরের হাত ছেড়ে দিইনি।”</i>','তোমার হাত ধরে সারাজীবন পথ চলতে চাই।']},
{t:'আমার একটাই চাওয়া',b:['আজ তোমার জন্মদিনে তোমার কাছে আমার একটাই চাওয়া—','<b>তুমি আমার পাশে থেকো।</b> শুধু আজ নয়, আগামীকালও, তার পরের দিনও, এভাবে সারাজীবন।','আমি চাই, তুমি আমার কাছে নিজেকে নিরাপদ ও মূল্যবান মনে করো। তোমাকে দেখতে চাই আমার সবচেয়ে কাছের বন্ধু, আমার বিশ্বাসের মানুষ এবং আমার ভবিষ্যতের সঙ্গী হিসেবে।','আল্লাহ তোমাকে সব সময় ভালো রাখুন, সুস্থ রাখুন এবং নেক হায়াত দান করুন।','<span class="big">Happy Birthday, My Princess 🌸<br>You Are My Today, My Tomorrow,<br>And My Forever.<br>I Love You, Today, Tomorrow &amp; Forever! ❤️</span>','<span class="sg">ইতি, তোমার সেই মানুষটি, যে তোমাকে নিজের জীবনের প্রতিটি আগামী দিনে পাশে দেখতে চায়। ❤️</span>']}
];

var TREE_LETTER=[
  'শুভ জন্মদিন, আমার প্রিন্সেস 🌸',
  'তুমি আমার আজ, আমার আগামীকাল আর আমার চিরকাল।',
  'তুমি আমার পাশে থেকো। শুধু আজ নয়, আগামীকালও, তার পরের দিনও, এভাবে সারাজীবন।',
  'তোমাকে ভালোবাসি, আজ, আগামীকাল আর সারাজীবন! ❤️'
];
BirthdayTree.config({dear:'প্রিয় নোভা,',lines:TREE_LETTER});

(function(){
  var scene=document.getElementById('scene'),intro=document.getElementById('intro'),world=document.getElementById('world'),
      candle=document.getElementById('candle'),wrap=document.getElementById('paperWrap'),lettersBox=document.getElementById('letters'),
      ringScreen=document.getElementById('ringScreen');
  var thint=document.getElementById('thint');
  var song=document.getElementById('song'),muteBtn=document.getElementById('mute'),MASTER=.7,songTick=null;
  function songVol(){var d=song.duration||23,t=song.currentTime,f=Math.max(0,Math.min(1,t/1.5,(d-t)/1.5));if(fadeUp<1)fadeUp=Math.min(1,fadeUp+.02);song.volume=Math.max(0,Math.min(1,MASTER*f*fadeUp))}
  var fadeUp=0;
  function startSong(){fadeUp=0;try{song.currentTime=0}catch(e){}song.volume=0;var p=song.play();if(p&&p.catch)p.catch(function(){});clearInterval(songTick);songTick=setInterval(songVol,60)}
  function stopSong(){clearInterval(songTick);song.pause()}
  muteBtn.addEventListener('click',function(){song.muted=!song.muted;muteBtn.classList.toggle('off',song.muted);muteBtn.setAttribute('aria-pressed',song.muted)});
  var lit=false,timer=null,E=['❤️','💖','🌸','✨','💕','🌹'];


  /* ---- extra animation helpers ---- */
  var CONF=['#fff8ea','#ffd1df','#f7a1bd','#e0678a','#fde8a8','#ffffff','#c2467a'];
  function burst(x,y,n,a0,a1,pw){
    for(var i=0;i<n;i++){
      var e=document.createElement('span'),w=6+Math.random()*7,h=Math.random()<.5?w:w*2.2;
      e.style.cssText='position:fixed;z-index:40;pointer-events:none;left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;background:'+CONF[i%CONF.length]+';border-radius:'+(Math.random()<.4?'50%':'2px');
      document.body.appendChild(e);
      var ang=(a0==null)?Math.random()*Math.PI*2:a0+Math.random()*(a1-a0),d=(70+Math.random()*190)*(pw||1),dx=Math.cos(ang)*d,dy=Math.sin(ang)*d-60,rot=(Math.random()-.5)*900;
      var an=e.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) rotate('+rot/2+'deg)',opacity:1,offset:.45},{transform:'translate('+dx*1.2+'px,'+(dy+220)+'px) rotate('+rot+'deg)',opacity:0}],{duration:1400+Math.random()*1100,easing:'cubic-bezier(.2,.7,.4,1)'});
      an.onfinish=(function(x){return function(){x.remove()}})(e);
    }
  }
  var BC=['#ff8fb1','#ffd166','#f06292','#fff1c1','#e0678a','#ffb3cc'];
  function balloons(n){
    for(var i=0;i<n;i++){
      var b=document.createElement('div');b.className='bl';
      b.style.cssText='left:'+(Math.random()<.5?(1+Math.random()*16):(80+Math.random()*14))+'vw;--c:'+BC[Math.floor(Math.random()*BC.length)]+';--du:'+(7+Math.random()*5)+'s;--dl:'+(Math.random()*1.6)+'s';
      document.body.appendChild(b);(function(x){setTimeout(function(){x.remove()},14000)})(b);
    }
  }
  (function(){var d=document.getElementById('deco'),EM=['🎈','✨','🌸','💖','🎀','⭐','💕'];
    for(var i=0;i<22;i++){var e=document.createElement('span');e.className='dc';e.textContent=EM[i%EM.length];
      e.style.cssText='left:'+(Math.random()*96)+'%;font-size:'+(16+Math.random()*22)+'px;--du:'+(8+Math.random()*8)+'s;--dl:'+(-Math.random()*14)+'s';d.appendChild(e)}})();


  /* falling confetti + sparkle trail */
  setInterval(function(){
    if(!scene.classList.contains('play')||!intro.classList.contains('hide'))return;
    var e=document.createElement('span'),w=5+Math.random()*6;
    e.style.cssText='position:fixed;z-index:1;pointer-events:none;top:-20px;left:'+(Math.random()*100)+'vw;width:'+w+'px;height:'+(w*(Math.random()<.5?1:2))+'px;background:'+CONF[Math.floor(Math.random()*CONF.length)]+';border-radius:'+(Math.random()<.4?'50%':'2px')+';opacity:.9';
    document.body.appendChild(e);
    var sx=(Math.random()-.5)*120,r=(Math.random()-.5)*900;
    var an=e.animate([{transform:'translate(0,0) rotate(0)'},{transform:'translate('+sx+'px,'+innerHeight*1.1+'px) rotate('+r+'deg)'}],{duration:5000+Math.random()*4000,easing:'linear'});
    an.onfinish=function(){e.remove()};
  },320);
  var lastTr=0;
  window.addEventListener('pointermove',function(ev){
    var n=performance.now();if(n-lastTr<55||ringScreen.classList.contains('show'))return;lastTr=n;
    var e=document.createElement('span');e.textContent=Math.random()<.5?'✦':'✧';
    e.style.cssText='position:fixed;z-index:50;pointer-events:none;left:'+ev.clientX+'px;top:'+ev.clientY+'px;color:#fff3c4;font-size:'+(10+Math.random()*12)+'px;text-shadow:0 0 8px rgba(255,220,150,.95);margin:-8px 0 0 -6px';
    document.body.appendChild(e);
    var an=e.animate([{transform:'translate(0,0) scale(1) rotate(0)',opacity:1},{transform:'translate('+((Math.random()-.5)*30)+'px,'+(18+Math.random()*26)+'px) scale(.2) rotate(120deg)',opacity:0}],{duration:800,easing:'ease-out'});
    an.onfinish=function(){e.remove()};
  });

  function fit(){world.style.setProperty('--s',Math.max(.35,Math.min(Math.min(window.innerWidth,560)/400,window.innerHeight/640)))}
  fit();window.addEventListener('resize',fit);

  /* floating hearts everywhere */
  function spawn(n,fast){for(var i=0;i<n;i++){var e=document.createElement('span');e.className='fl';e.textContent=E[Math.floor(Math.random()*E.length)];
    e.style.left=Math.random()*100+'vw';e.style.fontSize=(14+Math.random()*22)+'px';e.style.animationDuration=(fast?3+Math.random()*3:9+Math.random()*8)+'s';
    e.style.zIndex=fast?'30':'1';document.body.appendChild(e);(function(x){setTimeout(function(){x.remove()},17000)})(e)}}
  setInterval(function(){spawn(1)},1800);

  /* envelopes */
  LETTERS.forEach(function(l,i){
    var b=document.createElement('button');b.className='env';
    var rots=[-5,3,-2,5,-4,2,-3];b.style.setProperty('--rot',rots[i%7]+'deg');b.style.setProperty('--n',i);
    b.setAttribute('aria-label',l.t);
    b.innerHTML='<span class="seal">&#9829;</span>';
    b.addEventListener('click',function(){openLetter(i)});
    lettersBox.appendChild(b);
  });
  function openLetter(i){
    var l=LETTERS[i];
    document.getElementById('dear').textContent='প্রিয় নোভা,';
    var m=document.getElementById('msg');m.innerHTML='';
    l.b.forEach(function(p,k){var el=document.createElement('p');el.style.setProperty('--k',k);el.innerHTML=p;m.appendChild(el)});
    var pp=document.getElementById('paper');pp.scrollTop=0;
    wrap.classList.remove('open');void wrap.offsetWidth;wrap.classList.add('open');
    spawn(18,true);
  }
  function closeLetter(){wrap.classList.remove('open')}
  document.getElementById('pclose').addEventListener('click',closeLetter);
  wrap.addEventListener('click',function(e){if(e.target===wrap)closeLetter()});

  function play(){
    clearTimeout(timer);scene.classList.remove('play','out');void scene.offsetWidth;scene.classList.add('play');
    lit=false;timer=setTimeout(function(){lit=true},2700);
  }
  function resetAll(){
    clearTimeout(timer);stopSong();muteBtn.hidden=true;closeLetter();ringHide();BirthdayTree.hide();thint.classList.remove('show');scene.classList.remove('play','out');intro.classList.remove('hide');intro.classList.remove('go');void intro.offsetWidth;intro.classList.add('go');
  }
  document.getElementById('openBtn').addEventListener('click',function(){var r=this.getBoundingClientRect();muteBtn.hidden=false;startSong();burst(r.left+r.width/2,r.top+r.height/2,70);intro.classList.add('hide');spawn(30,true);play();balloons(9);setTimeout(function(){var q=candle.getBoundingClientRect();burst(innerWidth/2,q.bottom+60,40);burst(0,innerHeight,45,-1.4,-.35,1.7);burst(innerWidth,innerHeight,45,-2.8,-1.75,1.7)},1100)});
  candle.addEventListener('click',function(){
    if(!lit||scene.classList.contains('out'))return;
    scene.classList.add('out');spawn(30,true);var q=candle.getBoundingClientRect();burst(q.left+q.width/2,q.top+q.height/2,80);balloons(10);
  });
  document.getElementById('again').addEventListener('click',resetAll);

  /* ---------- diamond ring + name text ---------- */
  for(var s=0;s<14;s++){var sp=document.createElement('span');sp.className='sp2';sp.textContent='✦';sp.style.left=Math.random()*100+'%';sp.style.top=Math.random()*100+'%';
    sp.style.fontSize=(8+Math.random()*14)+'px';sp.style.animationDelay=Math.random()*2+'s';ringScreen.appendChild(sp)}
  function ringShow(){ringScreen.classList.add('show');NovaRing.show();spawn(25,true)}
  function ringHide(){ringScreen.classList.remove('show');NovaRing.hide()}
  document.getElementById('next').addEventListener('click',function(){BirthdayTree.show();setTimeout(function(){thint.classList.add('show')},900)});
  document.getElementById('treeCanvas').addEventListener('click',function(){thint.classList.remove('show')});
  document.getElementById('treeRing').addEventListener('click',function(){BirthdayTree.hide();thint.classList.remove('show');ringShow()});
  document.getElementById('ringClose').addEventListener('click',ringHide);
  document.getElementById('ringBack').addEventListener('click',resetAll);
  BirthdayTree.onAgain(resetAll);
})();

</script>
</body></html>
